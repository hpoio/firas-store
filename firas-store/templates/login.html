{% extends "base.html" %}

{% block title %}Login - Firas Store{% endblock %}

{% block content %}
<section class="hero" style="text-align:center; padding-top:100px;">
    <div style="max-width:400px; margin:0 auto;">
        <h1>Admin Login</h1>
        <p>Access admin dashboard</p>
        
        <form id="login-form" method="POST" style="max-width:300px; margin:0 auto;">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="username" name="username" placeholder="admin" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" name="password" placeholder="admin123" required>
            </div>
            <button type="submit" class="btn">Login</button>
        </form>
        
            <p style="margin-top:2rem; opacity:0.8; text-align:center;">Demo: admin / admin123</p>
    </div>
</section>
{% endblock %}
